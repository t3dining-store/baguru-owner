<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ★viewport-fit=cover は付けない。Owner から移ったページで cover を付けると、iPhone で使える高さが時計の帯のぶん短くなり、
     下にすき間ができる（2026-11-01 に測った。README の「Owner から開いたアプリは…」）。cover が無いと、iPhone が時計の帯の下から並べてくれる -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1f1916">
<title>公式アプリ｜バグる Owner</title>
<!-- ============================================================
 *  公式アプリを、バグる Owner の中にはめ込むページ（2026-11-05 ko-dai さんの指示「直してください」）
 *  わけ：お店用アプリの引っ越し（../お店用アプリの引っ越し.md）で、Owner は t3dining-store.github.io に移り、
 *    公式アプリ（t3dining.github.io/baguru-app/）は Owner の範囲（manifest の scope "/"）の外になった。
 *    iPhone のホーム画面の Owner から開くと、ブラウザの画面（枠つき）になる。
 *    このページは Owner の範囲の中にあるので枠が付かない。公式アプリは中の iframe に出す。
 *  ★このページは、お店の保存（合言葉など。同じ保存場所にある）を読まない・渡さない。
 *    覚えるのは、はめ込んだ公式アプリのテスト用アカウントの鍵（bg.appTest）だけ（下の「テスト用アカウントの鍵を預かる」）
 *  ★🏠 は足さない。公式アプリの側の 🏠 が、枠の外（Owner）に戻る（公式アプリのセッションが直す）。2つ出さないため
 *  ★sandbox は付けない（テスト用アカウントで、スタンプや LINE の QR をカメラで読むため。allow で許すものを決める）
 *  はめ込まれた公式アプリの保存は、ブラウザが Owner の中だけの場所に分ける（ふつうに開いた公式アプリとは別。テスト用アカウントは作り直し）。
 *    ★iPhone の Safari は、その保存を閉じると消す（パソコンの Chrome は残す）。そのため鍵をこのページに預ける（2026-11-06）
 * ============================================================ -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1916; }   /* 色は公式アプリの上の帯と同じ */
  /* iPhone の安全な余白は、このページで取る（中の公式アプリには届かないため）。いまは cover が無いので 0 */
  .frame {
    position: fixed;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
  }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #e7ddd0; }   /* 公式アプリの地の色 */
</style>
</head>
<body>
<div class="frame">
  <iframe id="app" title="バグる 公式アプリ" allow="camera; geolocation; clipboard-write; web-share; fullscreen"></iframe>
</div>
<script>
  // 行き先は公式アプリの公開先（この Mac で開いたときだけ手元の公式アプリ）。?from=owner は「Owner から開いた」印で、必ず付ける。
  // ・?to=… で、公式アプリの中のページを選べる（例：app.html?to=takeout.html。to の中に ? や # を入れるときは encodeURIComponent で）。
  //   ホームページの中の「モバイルオーダー」「アプリを開く」を、Owner の中から開いたときに使う（2026-11-05。セッション「バグる HP」）
  //   ★開くのは公式アプリの公開先（https://t3dining.github.io/baguru-app/）の下だけ。ほかのアドレス（ほかの場所・../ で上に出るもの・javascript: など）は開かず、公式アプリの入口を出す
  // ・このページを開いたときの、to のほかの ?…（この Mac の ?test など）と #… も渡す
  (function () {
    var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var base = new URL(LOCAL ? '../' : 'https://t3dining.github.io/baguru-app/', location.href);
    var frame = document.getElementById('app');

    // ---- テスト用アカウントの鍵を預かる（2026-11-06 ko-dai さんの報告「スマホのオーナーから公式アプリを開くと毎回合言葉を聞かれる。パソコンだと聞かれません」）
    // iPhone の Safari は、はめ込んだ公式アプリ（ほかの場所のページ）の保存を、閉じると消す。そのため、テスト用アカウントの鍵が毎回消え、
    // 作る画面（お店の合言葉）が毎回出ていた。鍵をこのページ（Owner の場所。保存は消えない）にも預け、開いたときに返す。
    // ・受けるのは、中の iframe の窓からで、場所が公式アプリの公開先（この Mac では同じ場所）のときだけ。返す先も名指し
    // ・{ type: 'baguru-app', kind: 'testAuth-hello' } → 預かっている鍵を { type: 'baguru-owner', kind: 'testAuth', auth } で返す（無ければ null）
    // ・{ type: 'baguru-app', kind: 'testAuth-set', auth } → 鍵を覚え直す（null なら消す）
    // ★覚えるのは、この1つの名前（bg.appTest）だけ。ほかの保存（お店の合言葉など）は読まない・渡さない
    // ★中の側は 公式アプリの js/app.js の「テスト用アカウントの鍵を、Owner にも預ける」。知らせの形を変えるときは、両方を一緒に直す
    var KEEP = 'bg.appTest';
    var pick = function (a) {
      return a && typeof a === 'object' && typeof a.no === 'string' && typeof a.key === 'string'
        && a.no.length > 0 && a.no.length <= 60 && a.key.length > 0 && a.key.length <= 200 ? { no: a.no, key: a.key } : null;
    };
    addEventListener('message', function (e) {
      if (e.source !== frame.contentWindow || e.origin !== base.origin) return;
      var d = e.data || {};
      if (d.type !== 'baguru-app') return;
      if (d.kind === 'testAuth-hello') {
        var kept = null;
        try { kept = pick(JSON.parse(localStorage.getItem(KEEP) || 'null')); } catch (x) { kept = null; }
        e.source.postMessage({ type: 'baguru-owner', kind: 'testAuth', auth: kept }, e.origin);
      } else if (d.kind === 'testAuth-set') {
        var a = pick(d.auth);
        try { if (a) localStorage.setItem(KEEP, JSON.stringify(a)); else localStorage.removeItem(KEEP); } catch (x) { /* 保存できない端末では、今までのとおり */ }
      }
    });

    var here = new URL(location.href);
    var url;
    try { url = new URL(here.searchParams.get('to') || '', base); } catch (e) { url = null; }
    if (!url || url.origin !== base.origin || url.pathname.indexOf(base.pathname) !== 0) url = new URL(base.href);
    here.searchParams.forEach(function (v, k) { if (k !== 'to') url.searchParams.set(k, v); });
    url.searchParams.set('from', 'owner');
    if (here.hash) url.hash = here.hash;
    frame.src = url.href;
  })();
</script>
</body>
</html>
